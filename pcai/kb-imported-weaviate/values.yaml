  AUTHENTICATION_APIKEY_USERS: "admin-user"

envSecrets:
  AUTHENTICATION_APIKEY_ALLOWED_KEYS: weaviate-api-key
ezua:
  virtualService:
    endpoint: "weaviate.YOUR.AIE.DOMAIN"
    istioGateway: "istio-system/ezaf-gateway"