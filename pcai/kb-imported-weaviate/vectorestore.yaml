---
apiVersion: v1
data:
  API_KEY: "YOUR_WEAVIATE_API_TOKEN"
  PASSWORD: ""
  USERNAME: ""
kind: Secret
metadata:
  name: my-weaviate-credentials
  namespace: ezai-services
type: Opaque
---
apiVersion: genai.hpe.com/v1alpha1
kind: VectorStore
metadata:
  name: my-weaviate
  namespace: ezai-services
spec:
  authSecret:
    name: my-weaviate-credentials
  description: My Weaviate VectorDB...
  vectordb:
    config:
      # Weaviate Cloud client will add 'grpc-' to grpc endpoint
      grpcEndpoint: weaviate-cloud-compatible.YOUR.AIE.DOMAIN
      grpcPort: 443
      httpEndpoint: weaviate-cloud-compatible.YOUR.AIE.DOMAIN
      httpPort: 443
    provider: weaviate