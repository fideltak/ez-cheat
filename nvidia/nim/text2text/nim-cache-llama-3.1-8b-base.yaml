apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: llama-3.1-8b-base
spec:
  source:
    ngc:
      modelPuller: nvcr.io/nim/meta/llama-3.1-8b-base:1.1.2
      pullSecret: ngc-secret
      authSecret: ngc-api-secret
      model:
        engine: vllm
  storage:
    pvc:
      create: false
      name: llama-3.1-8b-base
  gpuSelectors:
    nvidia.com/gpu.product: NVIDIA-L4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-3.1-8b-base
spec:
  resources:
    requests:
      storage: 100G
  accessModes:
  - ReadWriteMany