apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: llama-3-1-8b-base
spec:
  image:
    repository: nvcr.io/nim/meta/llama-3.1-8b-base
    tag: '1.1.2'
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api-secret
  storage:
    nimCache:
      name: llama-3.1-8b-base
      profile: ''
  replicas: 1
  resources:
    limits:
      nvidia.com/gpu: 1
      memory: 32Gi
      cpu: 5000m
    requests:
      memory: 32Gi
      cpu: 5000m      
  expose:
    service:
      type: ClusterIP
      port: 8000
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-A100-PCIE-40GB
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: llama-3-1-8b-base
spec:
  gateways:
  - istio-system/ezaf-gateway
  hosts:
  - llama-3-1-8b-base.ezua.fumi.jp
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: llama-3-1-8b-base
        port:
          number: 8000